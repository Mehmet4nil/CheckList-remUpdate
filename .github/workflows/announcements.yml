# Yonetici panelinden yazilan duyurulari gonderir. KAYNAK: CheckList reposu
# tool/github/announcements.yml; buraya tool/sync_release_repo.sh kopyalar
# (bu dosyayi burada elle degistirme).
#
# YALNIZ elle / panelden tetiklenir (workflow_dispatch). Zamanlanmis yedek
# 2026-10-03'te kaldirildi: GitHub saatlerce gec calistiriyordu, her
# calisma mail atiyordu ve panel zaten aninda tetikliyor. Tetikleme
# basarisiz olursa duyuru "Bekliyor"da kalir, panelden "Simdi gonder".
# Anahtar repo "secret"inda (FCM_KEY), kodda degil.
name: Duyurular

on:
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: announcements
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Bekleyen duyurulari gonder
        env:
          FCM_KEY: ${{ secrets.FCM_KEY }}
        run: |
          umask 077
          printf '%s' "$FCM_KEY" > "$RUNNER_TEMP/key.json"
          CHECKLIST_FCM_KEY="$RUNNER_TEMP/key.json" python3 tool/dispatch_announcements.py

      # Panel kullanici listesi: yeni surumu henuz acmamis hesaplarin
      # profilini olustur (var olana dokunmaz). Hata gonderimi etkilemez.
      - name: Panel kullanici listesini tamamla
        if: always()
        continue-on-error: true
        run: CHECKLIST_FCM_KEY="$RUNNER_TEMP/key.json" python3 tool/sync_profiles.py
