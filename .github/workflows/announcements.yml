# Yonetici panelinden yazilan duyurulari gonderir. KAYNAK: CheckList reposu
# tool/github/announcements.yml; buraya tool/sync_release_repo.sh kopyalar
# (bu dosyayi burada elle degistirme).
#
# Herkese acik repoda calisir: Actions dakikasi sinirsiz, 5 dakikada bir
# kontrol edilebilir. Anahtar repo "secret"inda (FCM_KEY), kodda degil.
name: Duyurular

on:
  schedule:
    - cron: "*/5 * * * *" # GitHub yogunken birkac dakika gecikebilir
  workflow_dispatch: {}

# Yalniz zamanlama ve elle tetikleme: fork/PR olaylari yok (secret'a
# erisemezler zaten).
permissions:
  contents: write # 60 gun kurali icin bos "keepalive" commit'i

concurrency:
  group: announcements
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Bekleyen duyurulari gonder
        env:
          FCM_KEY: ${{ secrets.FCM_KEY }}
        run: |
          umask 077
          printf '%s' "$FCM_KEY" > "$RUNNER_TEMP/key.json"
          CHECKLIST_FCM_KEY="$RUNNER_TEMP/key.json" python3 tool/dispatch_announcements.py

      # Acik repolarda 60 gun degisiklik olmazsa GitHub zamanlanmis isleri
      # kapatir. 45 gunden eskiyse bos bir commit atar.
      - name: Zamanlamayi canli tut
        run: |
          last=$(git log -1 --format=%ct)
          days=$(( ($(date +%s) - last) / 86400 ))
          if [ "$days" -ge 45 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive (duyuru zamanlamasi)"
            git push
          fi
